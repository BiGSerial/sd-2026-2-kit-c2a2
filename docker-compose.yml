# Sobe o sistema inteiro:  docker compose up --build
#
#   cliente --REST--> geracao --REST--> recuperacao --REST--> ingestao <--arquivo-- worker
#                        |                                        |                     ^
#                        +--> LLM (externo, protegido)            +--- fila Redis ------+
#
# Variaveis (opcionais) sao lidas do arquivo .env; sem LLM_API_KEY o LLM roda em modo simulado.
#
# Portas: tudo e publicado SO em 127.0.0.1 (acesso da propria maquina). O Redis nao tem
# senha e fica sempre em 127.0.0.1. Para abrir as APIs na rede (ex.: VM na nuvem), defina
# BIND_ADDR=0.0.0.0 no .env - e proteja-as com firewall.
# Reinicio: todos os servicos usam "unless-stopped" (voltam apos falha ou reboot do Docker,
# mas nao depois de um "docker compose stop" manual).

x-saude: &saude
  interval: 5s
  timeout: 3s
  retries: 10
  start_period: 10s

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]   # a fila sobrevive a reinicio do Redis
    volumes:
      - redis_dados:/data
    ports: ["127.0.0.1:6379:6379"]   # sem senha: nunca exponha na rede
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  # Servico 1a - ingestao (API): recebe documentos e os coloca na fila
  ingestao:
    build:
      context: .
      dockerfile: servicos/ingestao/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /dados
    volumes:
      - indice:/dados:ro               # a API so le o indice; quem escreve e o worker
    ports: ["${BIND_ADDR:-127.0.0.1}:8001:8001"]
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      <<: *saude
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/saude', timeout=3)"]

  # Servico 1b - ingestao (worker): consome a fila, gera embeddings e grava o indice
  # Mantenha UMA unica replica: ele e o unico escritor do arquivo de indice.
  ingestao-worker:
    build:
      context: .
      dockerfile: servicos/ingestao/Dockerfile
    command: ["python", "-m", "servicos.ingestao.worker"]
    environment:
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /dados
    volumes:
      - indice:/dados
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Servico 2 - recuperacao: busca por similaridade nos trechos indexados
  recuperacao:
    build:
      context: .
      dockerfile: servicos/recuperacao/Dockerfile
    environment:
      URL_INGESTAO: http://ingestao:8001
    ports: ["${BIND_ADDR:-127.0.0.1}:8002:8002"]
    restart: unless-stopped
    depends_on:
      ingestao:
        condition: service_healthy
    healthcheck:
      <<: *saude
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/saude', timeout=3)"]

  # Servico 3 - geracao: monta o prompt e chama o LLM (circuit breaker + timeout + retentativa)
  geracao:
    build:
      context: .
      dockerfile: servicos/geracao/Dockerfile
    environment:
      URL_RECUPERACAO: http://recuperacao:8002
      LLM_API_KEY: ${LLM_API_KEY:-}      # vazio = modo simulado (offline). NUNCA escreva a chave no codigo.
      LLM_API_URL: ${LLM_API_URL:-https://api.openai.com/v1/chat/completions}
      LLM_MODELO: ${LLM_MODELO:-gpt-4o-mini}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-10}                    # tempo-limite por chamada (s)
      LLM_TENTATIVAS: ${LLM_TENTATIVAS:-3}               # retentativas por pergunta
      LLM_BACKOFF: ${LLM_BACKOFF:-0.5}                   # espera inicial entre tentativas (s)
      LLM_LIMITE_FALHAS: ${LLM_LIMITE_FALHAS:-3}         # falhas seguidas que abrem o circuito
      LLM_ESPERA_CIRCUITO: ${LLM_ESPERA_CIRCUITO:-20}    # segundos com o circuito aberto
    ports: ["${BIND_ADDR:-127.0.0.1}:8003:8003"]
    restart: unless-stopped
    depends_on:
      recuperacao:
        condition: service_healthy
    healthcheck:
      <<: *saude
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/saude', timeout=3)"]

  # So para demonstrar a resiliencia: docker compose --env-file .env.demo --profile demo up --build
  llm-falso:
    image: python:3.12-slim
    profiles: ["demo"]
    command: ["python", "/scripts/llm_falso.py", "9000"]
    volumes:
      - ./scripts:/scripts:ro
    ports: ["127.0.0.1:9000:9000"]
    restart: unless-stopped
    healthcheck:
      <<: *saude
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/modo', timeout=3)"]

volumes:
  redis_dados:
  indice:
